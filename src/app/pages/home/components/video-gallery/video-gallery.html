<div class="video-section">
  <div class="video-section__heading">
    <div>
      <p class="eyebrow">Galería multimedia</p>
      <h3>Microspots audiovisuales</h3>
    </div>
    <p>Historias breves para mirar, compartir y conversar.</p>
  </div>

  <div id="video-gallery" class="video-grid">
    @for (video of visibleVideos(); track video.title; let index = $index) {
      <article class="video-card">
        <div class="video-card__placeholder">
          <span class="video-card__play" aria-hidden="true">▶</span>
          <span class="video-card__index">{{ index + 1 }}</span>
        </div>
        <div>
          <span>{{ video.duration }}</span>
          <h4>{{ video.title }}</h4>
        </div>
      </article>
    }
  </div>

  <button
    class="button button--outline video-section__toggle"
    type="button"
    aria-controls="video-gallery"
    [attr.aria-expanded]="videoGalleryExpanded()"
    (click)="toggleVideoGallery()"
  >
    {{ videoGalleryExpanded() ? 'Mostrar menos' : 'Mirá todos los videos' }}
  </button>
</div>
